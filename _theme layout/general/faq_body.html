<h1 class="pmf-page-title">{L_FAQ_TITLE}</h1>

<!-- BEGIN faq_block_link -->
<div class="pmf-panel pmf-panel--faq-toc">
	<dl class="pmf-faq">
		<dt class="pmf-faq__block-title">{faq_block_link.BLOCK_TITLE}</dt>
		<!-- BEGIN faq_row_link -->
		<dd class="pmf-faq__question"><a href="{faq_block_link.faq_row_link.U_FAQ_LINK}">{faq_block_link.faq_row_link.FAQ_LINK}</a></dd>
		<!-- END faq_row_link -->
	</dl>
</div>
<!-- END faq_block_link -->

<!-- BEGIN faq_block -->
<div class="pmf-panel pmf-panel--faq {faq_block.ROW_CLASS_NEW}">
	<h2 class="pmf-panel__title">{faq_block.BLOCK_TITLE}</h2>
	<!-- BEGIN faq_row -->
	<dl class="pmf-faq">
		<dt class="pmf-faq__question"><a name="{faq_block.faq_row.U_FAQ_ID}"></a><b>{faq_block.faq_row.FAQ_QUESTION}</b></dt>
		<dd class="pmf-faq__answer">{faq_block.faq_row.FAQ_ANSWER}</dd>
		<dd class="pmf-faq__back-top"><a href="#top">{L_BACK_TO_TOP} {L_BACK_TO_TOP_TEXT}</a></dd>
	</dl>
	<hr class="pmf-hr-dashed" />
	<!-- END faq_row -->
</div>
<!-- END faq_block -->

<form action="{S_JUMPBOX_ACTION}" method="get" name="jumpbox" class="pmf-jumpbox" onsubmit="if(document.jumpbox.f.value == -1){return false;}">
	<p class="pmf-jumpbox__row">{L_JUMP_TO}: {S_JUMPBOX_SELECT} <input class="pmf-btn pmf-btn--outline" type="submit" value="{L_GO}" /></p>
</form>
