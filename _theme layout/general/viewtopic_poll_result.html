<!-- viewtopic_poll_result.html -->
<div class="pmf-panel pmf-panel--poll">
	<div class="pmf-poll__header">
		<h2 class="pmf-poll__question">{POLL_QUESTION}</h2>
		<div class="pmf-poll__close-link">{CLOSE_POLL}</div>
	</div>
	<fieldset class="pmf-poll__options">
		<!-- BEGIN poll_option -->
		<div class="pmf-poll__result">
			<label class="pmf-poll__result-label">{poll_option.POLL_OPTION_CAPTION}</label>
			<div class="pmf-poll__bar">
				<div class="pmf-poll__bar-fill" style="width: {poll_option.POLL_OPTION_PERCENT};"></div>
				<div class="pmf-poll__bar-desc">{poll_option.POLL_OPTION_RESULT} - {poll_option.POLL_OPTION_PERCENT}</div>
			</div>
			<!-- BEGIN option_voters -->
			<div class="pmf-poll__voters pmf-fa-raw">{poll_option.option_voters.POLL_OPTION_VOTERS}</div>
			<!-- END option_voters -->
		</div>
		<!-- END poll_option -->
		<div class="pmf-poll__meta">
			<strong>{L_TOTAL_VOTES}: {TOTAL_VOTES}</strong>
			{ALL_POLL_VOTERS_LIST}
			<!-- BEGIN cancel_vote --><b><a href="{U_CANCEL_VOTE}">{L_CANCEL_VOTE}</a></b><!-- END cancel_vote -->
		</div>
		<!-- BEGIN switch_back_to_vote -->
		<div class="pmf-poll__meta"><b><a href="{switch_back_to_vote.U_BACK_TO_VOTE}">{switch_back_to_vote.L_BACK}</a></b></div>
		<!-- END switch_back_to_vote -->
		<!-- BEGIN switch_hide_result -->
		<div class="pmf-poll__hide-msg" id="hide_result_msg">{L_POLL_HIDE_RESULT}</div>
		<!-- END switch_hide_result -->
		<div class="pmf-poll__meta">{L_VOTE_EXPIRE}</div>
	</fieldset>
</div>
