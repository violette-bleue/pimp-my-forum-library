<!-- BEGIN switch_user_logged_in --><p class="pmf-last-visit">{LAST_VISIT_DATE}</p><!-- END switch_user_logged_in -->
<p class="pmf-current-time">{CURRENT_TIME}</p>

<div class="pmf-panel pmf-panel--confirm">
	<h1 class="pmf-panel__title">{MESSAGE_TITLE}</h1>
	<form action="{S_CONFIRM_ACTION}" method="post">
		<p class="pmf-panel__body">{MESSAGE_TEXT}</p>
		{OPTIONAL_BAN_NEW}
		<fieldset class="pmf-panel__footer pmf-actions">
			{S_HIDDEN_FIELDS}
			<input class="pmf-btn pmf-btn--accent" type="submit" name="confirm" value="{L_YES}" />
			<input class="pmf-btn pmf-btn--outline" type="submit" name="cancel" value="{L_NO}" />
		</fieldset>
	</form>
</div>
