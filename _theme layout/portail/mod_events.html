<!-- mod_events --><div class="box mod_events">
	<div class="box-head">
		<i class="material-symbols-outlined">calendar_month</i>
		<span>{L_EVENTS}</span>
	</div>
	<div class="box-body inner_module">
		<!-- BEGIN event -->
		<div class="event_item" style="background-image: url({event.thumb});">
			<div class="blur" style="">
				<div>
					<a class="title" href="{event.url}">{event.title}</a>
				</div>
				<div class="date" style="">
					<p class="price"><span>{event.cost}</span>
						<a href="{event.catUrl}" class="categ {event.catClass}">{event.category}</a>
					</p>
					<i class="material-symbols-outlined">date_range</i><span>&nbsp;{event.date}</span>
				</div>
			</div>
		</div>
		<!-- END event -->
		<a class="button" target="_blank" href="/events">{L_ALL_EVENTS}</a>
	</div>
</div>
