<!-- mod_last_images --><div class="box box-last-images" id="{MODID}">
	<div class="box-head">
		<i class="material-symbols-outlined">collections</i>
		<span>{L_LAST_IMAGES}</span>
	</div>
	<div class="box-body gallery-slider">
		<div class="swiper-container modGallerySwiper" style="display: none">
			<div class="swiper-wrapper"></div>
			<div class="swiper-pagination"></div>
		</div>

		<script src="{U_SWIPER_JS}"></script>
		<a class="button" target="_blank" href="/images">{L_ALL_IMAGES}</a>
	</div>

	<script>
		function addCss(fileName) {
			var link = $("<link />",{
				rel: "stylesheet",
				type: "text/css",
				href: fileName
			});
			$('head').append(link);
		}

		$(function () {

			addCss("{U_SWIPER_CSS}");

			let Pic_full{MODID} = [];
			let Tit{MODID} = [];
			let Pic{MODID} = [];
			let Link{MODID} = [];
			let Alt{MODID} = [];
			let breakpoints_conf;
			let slides_count_conf;
            {PIC_FULL_LIST}
            {PIC_LIST}
            {TIT_LIST}
			{ALT_LIST}
            {LINK_LIST}

			for (let key in Pic_full{MODID}) {
				let val = Pic_full{MODID}[key];

				let item = document.createElement('div');
				item.setAttribute('style', `--swiper-slide-title:"`+Tit{MODID}[key]+`";max-height: 200px; align-self:center; text-align:center;`);
				item.classList.add('swiper-slide');
				item.addEventListener('click', function () {
					window.open(Link{MODID}[key], '_blank').focus();
				});

				let img = document.createElement('img');
				img.setAttribute('data-src', val);
				img.setAttribute('src', Pic{MODID}[key]);
				img.setAttribute('title', Alt{MODID}[key]);
				img.setAttribute('alt', Alt{MODID}[key]);
				img.classList.add('swiper-lazy');

				item.append(img);

				document.querySelector('#{MODID} .swiper-wrapper').append(item);
			}

			let mySwiper{MODID} = $('#{MODID} .modGallerySwiper');
			mySwiper{MODID}.hide();
			let width = $('#{MODID}.box-last-images').width();
			$('#{MODID} .gallery-slider').css('max-width', width);
			mySwiper{MODID}.show();

			$(window).on('resize', function () {
				let mySwiper{MODID} = $('#{MODID} .modGallerySwiper');
				mySwiper{MODID}.hide();
				let width = $('#{MODID}.box-last-images').width();
				$('#{MODID} .gallery-slider').css('max-width', width);
				mySwiper{MODID}.show();
			});

			if (width < 500) {
				slides_count_conf = 1;
				breakpoints_conf = {
					400: {
						slidesPerView: 1,
						spaceBetween: 5
					}
				}
			} else if (width < 650) {
				slides_count_conf = 2;
				breakpoints_conf = {
					400: {
						slidesPerView: 1,
						spaceBetween: 5
					},
					600: {
						slidesPerView: 2,
						spaceBetween: 10
					}
				}
			}  else if (width < 800) {
				slides_count_conf = 2;
				breakpoints_conf = {
					400: {
						slidesPerView: 1,
						spaceBetween: 5
					},
					600: {
						slidesPerView: 2,
						spaceBetween: 10
					}
				}
			} else {
				slides_count_conf = 4;
				breakpoints_conf = {
					400: {
						slidesPerView: 1,
						spaceBetween: 5
					},
					600: {
						slidesPerView: 2,
						spaceBetween: 10
					},
					800: {
						slidesPerView: 3,
						spaceBetween: 10
					},
					1000: {
						slidesPerView: 4,
						spaceBetween: 10
					}
				}
			}

			var swiper{MODID} = new Swiper("#{MODID} .modGallerySwiper", {
				effect: 'slide',
				preloadImages: false,
				lazy: true,
				speed: 900,
				slidesPerView: slides_count_conf,
				spaceBetween: 10,
				loop: true,
				autoplay: {
					delay: 3500,
					disableOnInteraction: false,
				},
				pagination: {
					el: "#{MODID} .swiper-pagination",

					clickable: true,
				},
				breakpoints: breakpoints_conf
			});
		});
	</script>
</div>
