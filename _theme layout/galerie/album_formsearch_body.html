<!-- album_formsearch_body --><div class="page-header">
    <h1>{L_SEARCH_TITLE}</h1>
</div>

<form action="{S_SEARCH_ACTION}" method="post">
    <div class="block">
        <div class="block-header">{L_SEARCH_QUERY}</div>
        <div class="block-content">
            <label>
                <span>{L_SEARCH_KEYWORDS}:</span>
                <input class="inputbox" type="text" name="search" maxlength="50"/>
            </label>
        </div>
    </div>

    <div class="block">
        <div class="block-header">
            {L_SEARCH_OPTIONS}
        </div>
        <div class="block-content">
            <label>
                <span>{L_GALLERIES}:</span>
                {S_FORUM_OPTIONS}
            </label>
            <label>
                <span>{L_SEARCH_PREVIOUS}:</span>
                <select class="inputbox" name="search_time">{S_TIME_OPTIONS}</select>
            </label>
        </div>
    </div>

    <div class="form-buttons">
        <input class="btn btn-default" type="submit" value="{L_SEARCH}" />
    </div>
</form>
