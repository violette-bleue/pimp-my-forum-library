<script src="{U_CFAQ_JSLIB}" type="text/javascript"></script>
<noscript>
<div class="pmf-panel"><p class="pmf-panel__body pmf-align-center">{L_CFAQ_NOSCRIPT}</p></div>
</noscript>

<h1 class="pmf-page-title">{L_FAQ_TITLE}</h1>
<!-- BEGIN faq_block -->
<div class="pmf-panel pmf-panel--faq">
	<dl class="pmf-faq">
		<dt class="pmf-faq__block-title">{faq_block.BLOCK_TITLE}</dt>
		<!-- BEGIN faq_row -->
		<dd class="pmf-faq__question" onclick="return CFAQ.display('faq_a_{faq_block.faq_row.U_FAQ_ID}', false);">
			<a href="javascript:void(0)" onclick="return CFAQ.display('faq_a_{faq_block.faq_row.U_FAQ_ID}', true);" onfocus="this.blur();">{faq_block.faq_row.FAQ_QUESTION}</a>
		</dd>
		<dd class="pmf-faq__answer" style="display:none;" id="faq_a_{faq_block.faq_row.U_FAQ_ID}"><p>{faq_block.faq_row.FAQ_ANSWER}</p></dd>
		<!-- END faq_row -->
	</dl>
</div>
<!-- END faq_block -->
<form action="{S_JUMPBOX_ACTION}" method="get" name="jumpbox" class="pmf-jumpbox" onsubmit="if(document.jumpbox.f.value == -1){return false;}">
	<p class="pmf-jumpbox__row">{L_JUMP_TO}: {S_JUMPBOX_SELECT} <input class="pmf-btn pmf-btn--outline" type="submit" value="{L_GO}" /></p>
</form>
