{JAVASCRIPT}

<!-- BEGIN switch_user_login_form_header -->
<div class="pmf-panel pmf-panel--login" data-pmf-slot="login-form-top">
	<form action="{S_LOGIN_ACTION}" method="post" name="form_login">
		<div class="pmf-panel__body pmf-login-form">
			<input placeholder="{L_USERNAME}" class="pmf-input" type="text" size="10" name="username" />
			<input placeholder="{L_PASSWORD}" class="pmf-input" type="password" size="10" name="password" />
			<br />
			<label>{L_AUTO_LOGIN}: <input type="checkbox" name="autologin" {AUTOLOGIN_CHECKED} /></label>
			{S_HIDDEN_FIELDS}<input class="pmf-btn pmf-btn--accent" type="submit" name="login" value="{L_LOGIN}" />
			<!-- BEGIN switch_social_login -->
			<div class="pmf-social-login pmf-fa-raw">
				<!-- BEGIN fb_connect -->
				<div class="fb-login-button"></div>
				<!-- END fb_connect -->
				<!-- BEGIN topicit_connect -->
				<div class="ti-connect"></div>
				<!-- END topicit_connect -->
			</div>
			<!-- END switch_social_login -->
		</div>
	</form>
</div>
<!-- END switch_user_login_form_header -->

<!-- BEGIN message_admin_index -->
<div class="pmf-panel pmf-panel--admin-message">
	<!-- BEGIN message_admin_titre -->
	<div class="pmf-panel__title">{message_admin_index.message_admin_titre.MES_TITRE}</div>
	<!-- END message_admin_titre -->
	<!-- BEGIN message_admin_txt -->
	<div class="pmf-panel__body">{message_admin_index.message_admin_txt.MES_TXT}</div>
	<!-- END message_admin_txt -->
</div>
<!-- END message_admin_index -->

{CHATBOX_TOP}

<div data-pmf-slot="board-index">
	{BOARD_INDEX}
</div>

{CHATBOX_BOTTOM}

<!-- BEGIN switch_user_login_form_footer -->
<div class="pmf-panel pmf-panel--login" data-pmf-slot="login-form-bottom">
	<form action="{S_LOGIN_ACTION}" method="post" name="form_login">
		<div class="pmf-panel__body pmf-login-form">
			<input placeholder="{L_USERNAME}" class="pmf-input" type="text" size="10" name="username" />
			<input placeholder="{L_PASSWORD}" class="pmf-input" type="password" size="10" name="password" />
			<br />
			<label>{L_AUTO_LOGIN}: <input type="checkbox" name="autologin" {AUTOLOGIN_CHECKED} /></label>
			{S_HIDDEN_FIELDS}<input class="pmf-btn pmf-btn--accent" type="submit" name="login" value="{L_LOGIN}" />
			<!-- BEGIN switch_social_login -->
			<div class="pmf-social-login pmf-fa-raw">
				<!-- BEGIN fb_connect -->
				<div class="fb-login-button"></div>
				<!-- END fb_connect -->
				<!-- BEGIN topicit_connect -->
				<div class="ti-connect"></div>
				<!-- END topicit_connect -->
			</div>
			<!-- END switch_social_login -->
		</div>
	</form>
</div>
<!-- END switch_user_login_form_footer -->

<!-- BEGIN switch_legend -->
<ul class="pmf-legend" data-pmf-slot="picture-legend">
	<li><img src="{FORUM_NEW_IMG}" alt="{L_NEW_POSTS}" loading="lazy" />{L_NEW_POSTS}</li>
	<li><img src="{FORUM_IMG}" alt="{L_NO_NEW_POSTS}" loading="lazy" />{L_NO_NEW_POSTS}</li>
	<li><img src="{FORUM_LOCKED_IMG}" alt="{L_FORUM_LOCKED}" loading="lazy" />{L_FORUM_LOCKED}</li>
</ul>
<!-- END switch_legend -->

{AUTO_DST}
