<!-- BEGIN switch_user_logged_in --><p class="pmf-last-visit">{LAST_VISIT_DATE}</p><!-- END switch_user_logged_in -->
<p class="pmf-current-time">{CURRENT_TIME}</p>

<!-- BEGIN switch_fb_explain -->
<div class="pmf-panel pmf-panel--warning">
	<img src="https://2img.net/i/fa/admin/icones/big_ico/warning.png" class="pmf-panel__icon" alt="" loading="lazy" />
	<div class="pmf-panel__body" id="fb_explain">{switch_fb_explain.FB_EXPLAIN}</div>
</div>
<!-- END switch_fb_explain -->

<form method="GET" id="frmAgreement" action="{U_AGREE_OVER13}">
	<div class="pmf-panel">
		<div class="pmf-panel__body pmf-fa-raw">{AGREEMENT}<br />{MY_RULES}</div>
		<div class="pmf-panel__body pmf-agreement-checks">
			<input type="hidden" name="step" value="2" />
			<!-- BEGIN switch_fb_explain -->
			<input type="hidden" name="uid" value="{switch_fb_explain.FB_UID}" />
			<!-- END switch_fb_explain -->
			<p><input type="checkbox" name="agreement" id="frmAgreeChkAgree" value="1" data-validation="required"/> <label for="frmAgreeChkAgree">{AGREE_CONDITIONS}</label></p>
			<p><input type="checkbox" name="privacy" id="frmAgreeChkPrivacy" value="1" data-validation="required"/> <label for="frmAgreeChkPrivacy">{AGREE_PRIVACY}</label></p>
		</div>
	</div>
	<div class="pmf-panel">
		<p class="pmf-panel__body pmf-align-center"><input type="submit" value="{AGREE_OVER_13}" class="pmf-btn pmf-btn--accent" /></p>
	</div>
</form>
