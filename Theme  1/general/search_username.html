<!-- BEGIN html_validation -->
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<body class="pmf-body">
<!-- END html_validation -->
<div id="pmf-simple-wrap" class="pmf-simple-wrap">
	<a name="top"></a>
	<form action="{S_SEARCH_ACTION}" method="post" name="search">
		<h1 class="pmf-panel__title">{L_SEARCH_USERNAME}</h1>
		<div class="pmf-panel">
			<p class="pmf-panel__body">
				<input class="pmf-input" type="text" name="search_username" value="{USERNAME}" />
				<input class="pmf-btn pmf-btn--accent" type="submit" name="search" value="{L_SEARCH}" />
			</p>
			<p class="pmf-panel__body pmf-text-muted">{L_SEARCH_EXPLAIN}</p>
			<!-- BEGIN switch_select_name -->
			<p class="pmf-panel__body">
				<select name="username_list" class="pmf-input">{S_USERNAME_OPTIONS}</select>
				<input class="pmf-btn pmf-btn--outline" type="button" name="use" value="{L_SELECT}" onclick="refresh_username(this.form.username_list.options[this.form.username_list.selectedIndex].value);" />
			</p>
			<!-- END switch_select_name -->
			<p class="pmf-panel__footer pmf-align-right"><a href="javascript:window.close();">{L_CLOSE_WINDOW}</a></p>
		</div>
	</form>
</div>
</body>
</html>
