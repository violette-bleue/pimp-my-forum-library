<!-- mod_last_donators --><div class="box box-last-donators" id="{MODID}">
	<div class="box-head">
		<i class="material-symbols-outlined">volunteer_activism</i>
		<span>{L_LAST_DONATORS}</span>
	</div>
	<div class="box-body gallery-slider">
		<div class="swiper-container modGallerySwiper" style="display: none">
			<div class="swiper-wrapper"></div>
			<div class="swiper-pagination"></div>
		</div>

		<a class="button" title="{L_EXPLAIN_DONATION}" href="/buy-credits">{L_MAKE_DONATION}</a>
	</div>

	<script src="{U_SWIPER_JS}"></script>
	<script>
		function addCss(fileName) {
			var link = $("<link />",{
				rel: "stylesheet",
				type: "text/css",
				href: fileName
			});
			$('head').append(link);
		}

		$(function () {

			addCss("{U_SWIPER_CSS}");

			let Avatar{MODID} = [];
			let Username{MODID} = [];
			let Date{MODID} = [];
			let breakpoints_conf;
			let slides_count_conf;
            {AVATAR_LIST}
            {USERNAME_LIST}
            {DATE_LIST}

			for (let key in Avatar{MODID}) {
				let val = Avatar{MODID}[key];

				let item = document.createElement('div');
				item.classList.add('swiper-slide');

				let tmpalt = Username{MODID}[key];
				let tmpdiv = document.createElement("div");
				tmpdiv.innerHTML = tmpalt;
				let alt = tmpdiv.textContent || tmpdiv.innerText || "";

				let img = document.createElement('img');
				img.setAttribute('data-src', val);
				img.setAttribute('src', Avatar{MODID}[key]);
				img.setAttribute('title', Date{MODID}[key]);
				img.setAttribute('alt', alt);
				img.classList.add('swiper-lazy');

				let infos = document.createElement('div');

				let item_u = document.createElement('p');
				item_u.innerHTML = Username{MODID}[key];

				let item_date = document.createElement('p');
				item_date.innerText = Date{MODID}[key];

				infos.append(item_u);
				infos.append(item_date);

				item.append(img);
				item.append(infos);

				document.querySelector('#{MODID} .swiper-wrapper').append(item);
			}

			let mySwiper{MODID} = $('#{MODID} .modGallerySwiper');
			mySwiper{MODID}.hide();
			let width = $('#{MODID}').width();
			$('#{MODID} .gallery-slider').css('max-width', width);
			mySwiper{MODID}.show();

			$(window).on('resize', function () {
				let mySwiper{MODID} = $('#{MODID} .modGallerySwiper');
				mySwiper{MODID}.hide();
				let width = $('#{MODID}.box-last-images').width();
				$('#{MODID} .gallery-slider').css('max-width', width);
				mySwiper{MODID}.show();
			});

			if (width < 400) {
				slides_count_conf = 1;
				breakpoints_conf = {
					400: {
						slidesPerView: 1,
						spaceBetween: 5
					}
				}
			} else if (width < 600) {
				slides_count_conf = 2;
				breakpoints_conf = {
					400: {
						slidesPerView: 1,
						spaceBetween: 5
					},
					600: {
						slidesPerView: 2,
						spaceBetween: 10
					}
				}
			}  else if (width < 800) {
				slides_count_conf = 2;
				breakpoints_conf = {
					400: {
						slidesPerView: 1,
						spaceBetween: 5
					},
					600: {
						slidesPerView: 2,
						spaceBetween: 10
					}
				}
			} else {
				slides_count_conf = 4;
				breakpoints_conf = {
					400: {
						slidesPerView: 1,
						spaceBetween: 5
					},
					600: {
						slidesPerView: 2,
						spaceBetween: 10
					},
					800: {
						slidesPerView: 3,
						spaceBetween: 10
					},
					1000: {
						slidesPerView: 4,
						spaceBetween: 10
					}
				}
			}

			var swiper{MODID} = new Swiper("#{MODID} .modGallerySwiper", {
				effect: 'slide',
				preloadImages: false,
				lazy: true,
				speed: 900,
				slidesPerView: slides_count_conf,
				spaceBetween: 10,
				loop: true,
				autoplay: {
					delay: 3500,
					disableOnInteraction: false,
				},
				pagination: {
					el: "#{MODID} .swiper-pagination",

					clickable: true,
				},
				breakpoints: breakpoints_conf
			});
		});
	</script>
</div>
