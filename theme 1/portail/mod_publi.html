<!-- mod_publi --><div class="box mod_publi">
	<div class="box-head">
		<i class="material-symbols-outlined">rate_review</i>
		<span>{L_PUBLI}</span>
	</div>
	<div class="box-body inner_module">
		<!-- BEGIN publication -->
		<div class="publi_item">
			<a class="title" target="_blank" href="{publication.URL}">{publication.TITLE}</a>
			<img loading="lazy" class="img" src="{publication.IMG_URL}" alt="{publication.TITLE}"/>
		</div>
		<!-- END publication -->
		<a href="/publi" target="_blank" class="button">{L_VIEW_ALL}</a>
	</div>
</div>
