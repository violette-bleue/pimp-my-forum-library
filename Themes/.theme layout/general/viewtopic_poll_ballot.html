<!-- viewtopic_poll_ballot.html -->
<form method="post" action="{S_POLL_ACTION}">
	<div class="pmf-panel pmf-panel--poll">
		<div class="pmf-poll__header">
			<h2 class="pmf-poll__question">{POLL_QUESTION}</h2>
			<p class="pmf-poll__close-link">{CLOSE_POLL}</p>
		</div>
		<fieldset class="pmf-poll__options">
			<!-- BEGIN poll_option -->
			<div class="pmf-poll__option">
				<label>{poll_option.POLL_OPTION_CAPTION}</label>
				<input type="{poll_option.POLL_TYPE_BUTTON}" name="vote_id[]" value="{poll_option.POLL_OPTION_ID}" />
			</div>
			<!-- END poll_option -->
			<div class="pmf-poll__actions">
				<input type="submit" name="submit" value="{L_SUBMIT_VOTE}" class="pmf-btn pmf-btn--accent" />
			</div>
			<div class="pmf-poll__results-link"><strong><a href="{U_VIEW_RESULTS}">{L_VIEW_RESULTS}</a></strong></div>
			<div class="pmf-poll__meta">
				<!-- BEGIN warning_public_votes -->
				{warning_public_votes.L_WARNING_PUBLIC_VOTES}<br/>
				<!-- END warning_public_votes -->
				{L_VOTE_EXPIRE}
			</div>
			{S_HIDDEN_FIELDS}
		</fieldset>
	</div>
</form>
